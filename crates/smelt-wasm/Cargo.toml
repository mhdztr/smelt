[package]
name = "smelt-wasm"
description = "WebAssembly bindings for smelt document conversion"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["wasm"]
wasm = ["smelt-core/wasm"]

[dependencies]
smelt-core = { path = "../smelt-core", default-features = false, features = ["wasm"] }
smelt-detect = { path = "../smelt-detect" }
wasm-bindgen = "0.2"
