[package]
name = "smelt-core"
description = "Intermediate Document Model, reader/writer traits, and native converters for smelt"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["native-full"]
native-full = ["markdown", "html", "text", "csv", "tsv", "epub", "pdf", "docx", "rayon"]
# wasm-safe subset: pure-Rust text/table formats with no C deps or rayon.
wasm = ["markdown", "html", "text", "csv", "tsv"]
markdown = ["dep:comrak"]
html = ["dep:scraper"]
text = []
csv = []
tsv = []
docx = ["dep:zip"]
epub = ["dep:zip"]
pdf = ["dep:pdf", "dep:lopdf"]
rayon = ["dep:rayon"]

[dependencies]
smelt-detect = { path = "../smelt-detect" }
comrak = { version = "0.56", default-features = false, optional = true }
scraper = { version = "0.27", optional = true }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
unicode-width = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"], optional = true }
pdf = { version = "0.9", optional = true }
lopdf = { version = "0.34", optional = true }
rayon = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1"
