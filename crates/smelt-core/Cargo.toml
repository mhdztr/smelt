[package]
name = "smelt-core"
description = "Intermediate Document Model, reader/writer traits, and native converters for smelt"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
smelt-detect = { path = "../smelt-detect" }
comrak = "0.56"
scraper = "0.27"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
unicode-width = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
pdf = "0.9"
lopdf = "0.34"
rayon = "1"

[dev-dependencies]
serde_json = "1"
