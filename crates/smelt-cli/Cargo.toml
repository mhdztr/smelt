[package]
name = "smelt-cli"
description = "Melt any document into any other"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "smelt"
path = "src/main.rs"

[dependencies]
smelt-core = { path = "../smelt-core", features = ["native-full"] }
smelt-formats = { path = "../smelt-formats" }
smelt-detect = { path = "../smelt-detect" }
clap = { version = "4", features = ["derive", "string"] }
clap_complete = "4"
clap_mangen = "0.2"
indicatif = "0.18"
owo-colors = "4"
rayon = "1"
sha2 = "0.10"
hex = "0.4"
serde_json = "1"
walkdir = "2"
