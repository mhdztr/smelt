[package]
name = "smelt-cli"
description = "Melt any document into any other"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "smelt"
path = "src/main.rs"

[dependencies]
smelt-core = { path = "../smelt-core" }
smelt-detect = { path = "../smelt-detect" }
clap = { version = "4", features = ["derive", "string"] }
clap_complete = "4"
indicatif = "0.18"
owo-colors = "4"
rayon = "1"
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
