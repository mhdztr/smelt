[workspace]
members = [
    "crates/smelt-detect",
    "crates/smelt-core",
    "crates/smelt-formats",
    "crates/smelt-cli",
    "crates/smelt-wasm",
]
resolver = "2"

[workspace.package]
version = "2.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mhdztr/smelt"

[profile.release]
lto = "thin"
strip = true
